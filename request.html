<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengajuan Purchase Request</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 max-w-md mx-auto min-h-screen pb-12">
  <h2 class="text-xl font-bold mb-4 text-slate-800 text-center">Form Pengajuan PR</h2>
  
  <!-- Form Input -->
  <form id="prForm" class="bg-white p-4 rounded-xl shadow-sm space-y-3 mb-6">
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1">PIC Pemesan *</label>
      <input type="text" id="pic_pemesan" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nama Anda">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Barang *</label>
      <input type="text" id="nama_barang" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contoh: Kertas A4">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1">Spesifikasi *</label>
      <textarea id="spesifikasi" required rows="2" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Warna, merk, ukuran, dll."></textarea>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Qty *</label>
        <input type="number" id="qty" min="1" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="10">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Satuan *</label>
        <input type="text" id="satuan" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Rim / Pcs">
      </div>
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1">Link Toko Online (Opsional)</label>
      <input type="url" id="link_produk" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://...">
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-blue-700 active:scale-95 transition">Kirim Pengajuan</button>
  </form>

  <!-- List Riwayat -->
  <h3 class="text-md font-bold mb-3 text-slate-800">Riwayat Pengajuan</h3>
  <div id="requestList" class="space-y-3"></div>

  <script>
    const SUPABASE_URL = 'https://cvhetsfucpsfeajhimpb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_w9faH5jFhjAlPyqv2xHOtg_znZZ6vjW';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Submit Data
    document.getElementById('prForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        pic_pemesan: document.getElementById('pic_pemesan').value,
        nama_barang: document.getElementById('nama_barang').value,
        spesifikasi: document.getElementById('spesifikasi').value,
        qty: parseFloat(document.getElementById('qty').value),
        satuan: document.getElementById('satuan').value,
        link_produk: document.getElementById('link_produk').value || null
      };

      const { error } = await supabaseClient.from('purchase_requests').insert([payload]);
      if (error) alert('Gagal mengirim pengajuan: ' + error.message);
      else {
        document.getElementById('prForm').reset();
        loadRequests();
      }
    });

    // Load Data
    async function loadRequests() {
      const { data, error } = await supabaseClient
        .from('purchase_requests')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) return;
      const container = document.getElementById('requestList');
      container.innerHTML = '';

      data.forEach(item => {
        const date = new Date(item.created_at).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });
        const isPending = item.status === 'Pending';
        const statusColor = item.status === 'Approved' ? 'bg-green-100 text-green-700' : 
                           item.status === 'Rejected' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700';

        container.innerHTML += `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs text-gray-400">${date} WIB</span>
                <h4 class="font-bold text-slate-800">${item.nama_barang} (${item.qty} ${item.satuan})</h4>
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${statusColor}">${item.status}</span>
            </div>
            <p class="text-xs text-gray-600"><strong>Spek:</strong> ${item.spesifikasi}</p>
            <p class="text-xs text-gray-500"><strong>Pemesan:</strong> ${item.pic_pemesan}</p>
            ${item.link_produk ? `<a href="${item.link_produk}" target="_blank" class="text-xs text-blue-500 underline block">Lihat Produk Online</a>` : ''}
            ${item.catatan_approval ? `<p class="text-xs text-slate-500 bg-slate-50 p-2 rounded"><strong>Catatan Purchasing:</strong> ${item.catatan_approval}</p>` : ''}
            ${isPending ? `
              <button onclick="deleteRequest('${item.id}')" class="w-full mt-2 text-xs text-red-600 bg-red-50 border border-red-200 py-2 rounded-lg font-semibold hover:bg-red-100">Batal / Hapus Pesanan</button>
            ` : ''}
          </div>
        `;
      });
    }

    // Delete Data
    async function deleteRequest(id) {
      if (confirm('Yakin ingin menghapus pengajuan ini?')) {
        const { error } = await supabaseClient.from('purchase_requests').delete().eq('id', id);
        if (error) alert('Gagal menghapus: ' + error.message);
        else loadRequests();
      }
    }

    loadRequests();
  </script>
</body>
</html>
